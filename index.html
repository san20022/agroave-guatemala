<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Welcome to AGROAVE, your premier source for high-quality Guatemalan onions. Discover our range of fresh produce and learn more about our commitment to sustainable agriculture."
		/>
		<meta name="author" content="Luis Sanchez" />
		<meta
			property="og:description"
			content="AGROAVE Guatemala is an agricultural company focused on producing
					premium onions in the fertile lands of Almolonga, Quetzaltenango.
					We are committed to sustainable farming, quality control, and
					export-ready packaging to meet international standards."
		/>

		<meta
			property="og:image"
			content="https://san20022.github.io/wdd231/images/marketonions.webp"
		/>

		<meta
			property="og:url"
			content="https://san20022.github.io/wdd231/index.html"
		/>

		<meta property="og:type" content="website" />

		<meta
			property="og:title"
			content="AGROAVE Guatemalan Onions Exported from Almolonga, Quetzaltenango to the USA"
		/>

		<meta name="twitter:card" content="summary_large_image" />

		<meta
			name="twitter:title"
			content="AGROAVE Premium Guatemalan Onions from Almolonga Exported to USA"
		/>

		<meta
			name="twitter:description"
			content="Discover AGROAVE’s high-quality onions grown sustainably in Guatemala. Export-ready, USDA-grade produce shipped directly to the USA."
		/>

		<meta
			name="twitter:image"
			content="https://san20022.github.io/wdd231/images/marketonions.webp"
		/>

		<link rel="stylesheet" type="text/css" href="styles/base.css" />
		<link rel="stylesheet" type="text/css" href="styles/form.css" />
		<link rel="stylesheet" type="text/css" href="styles/base-large.css" />
		<title>AGROAVE | Guatemalan 🇬🇹 Onions 🧅</title>
		<link rel="icon" href="images/onion.ico" type="image/x-icon" />
		<script src="scripts/base.js" type="module" defer></script>
	</head>
	<body>
		<header>
			<figure class="logo-container">
				<img src="images/agroave_logo.webp" alt="company logo" loading="lazy" />
			</figure>
			<h1>Welcome to AgroAVE</h1>
			<button id="menu" aria-label="Open menu"></button>
			<nav class="navigation">
				<a href="#home" title="Home" class="home nav-link">Home</a>
				<a href="#products" title="products" class="onions nav-link"
					>Products</a
				>
				<a href="#contactus" title="Contact" class="contact nav-link"
					>Contact Us</a
				>
				<a
					href="https://san20022.github.io/wdd231/siteplan.html"
					title="Site Plan"
					class="contact"
					>Site Plan</a
				>
			</nav>
		</header>

		<section class="api">
			<div class="card panel">
				<div class="weather-main">
					<h3 id="town"></h3>
					<img id="graphic" src="#" alt="Weather Icon" />
					<p id="description"></p>
				</div>
				<div class="weather-info">
					<p id="temperature"></p>
					<p id="humidity"></p>
					<p id="sunrise"></p>
					<p id="sunset"></p>
				</div>
			</div>

			<div class="panel weather-forecast">
				<h3>Weather Forecast</h3>
				<p id="forecast">Light showers expected tomorrow.</p>
			</div>
		</section>

		<main class="main"></main>

		<footer class="footer">
			<section class="footer-info"></section>
			<div class="social-icons"></div>
			<div class="footer-right">
				<p id="current-year"></p>
				<p id="lastModified"></p>
			</div>
		</footer>
	</body>
</html>
